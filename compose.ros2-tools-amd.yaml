services:
  dev:
    build:
      context: .
      dockerfile: Containerfile.ros2-tools-humble
    image: dev-sandbox-ros2-tools-amd
    command: sudo --preserve-env=SANDBOX_SSH_PORT,DISPLAY,XAUTHORITY,XDG_SESSION_TYPE /usr/local/sbin/dev-sandbox-sshd
    network_mode: host
    ipc: host
    devices:
      - /dev/dri:/dev/dri
      - /dev/snd:/dev/snd
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${SANDBOX_XAUTHORITY_FILE:-/dev/null}:/tmp/dev-sandbox.Xauthority:ro
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/dev-sandbox.Xauthority
      - XDG_SESSION_TYPE=${XDG_SESSION_TYPE}
