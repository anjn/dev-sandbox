services:
  dev:
    labels:
      io.github.anjn.dev-sandbox.host-podman: "true"
    security_opt:
      - label=disable
    volumes:
      - ${SANDBOX_HOST_PODMAN_SOCKET}:/run/podman/podman.sock
    environment:
      - CONTAINER_HOST=unix:///run/podman/podman.sock
      - SANDBOX_HOST_WORKSPACE=${WORKSPACE_DIR}
