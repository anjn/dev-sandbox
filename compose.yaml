services:
  dev:
    container_name: ${CONTAINER_NAME}
    build:
      context: .
      dockerfile: Containerfile
    command: bash
    working_dir: /workspace
    userns_mode: keep-id
    ipc: host
    security_opt:
      - seccomp=unconfined
    group_add:
      - keep-groups
    volumes:
      - ${WORKSPACE_DIR}:/workspace
      - ${HOME}/.codex:/home/ubuntu/.codex
    environment:
      - TZ=Asia/Tokyo
      - LANG=ja_JP.UTF-8
      - LC_CTYPE=ja_JP.UTF-8
    network_mode: host
    stdin_open: true
    tty: true
