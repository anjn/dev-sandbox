services:
  dev:
    container_name: ${CONTAINER_NAME}
    restart: always
    labels:
      io.github.anjn.dev-sandbox.managed: "true"
      io.github.anjn.dev-sandbox.workspace: ${WORKSPACE_DIR}
      io.github.anjn.dev-sandbox.role: ${SANDBOX_ROLE_RESOLVED:-base}
      io.github.anjn.dev-sandbox.platform: ${SANDBOX_PLATFORM_RESOLVED:-unknown}
    build:
      context: .
      dockerfile: Containerfile
    command: sudo --preserve-env=SANDBOX_SSH_PORT /usr/local/sbin/dev-sandbox-sshd
    working_dir: /workspace
    userns_mode: keep-id
    ipc: host
    security_opt:
      - seccomp=unconfined
    group_add:
      - keep-groups
    volumes:
      - ${WORKSPACE_DIR}:/workspace
      - ${HOME}/.codex:/home/ubuntu/.codex
      - ${SANDBOX_SSH_AUTHORIZED_KEYS_FILE}:/etc/dev-sandbox/authorized_keys:ro
      - ssh-host-keys:/var/lib/dev-sandbox/ssh
    environment:
      - TZ=Asia/Tokyo
      - LANG=ja_JP.UTF-8
      - LC_CTYPE=ja_JP.UTF-8
      - SANDBOX_SSH_PORT=${SANDBOX_SSH_PORT}
    network_mode: host
    stdin_open: true
    tty: true

volumes:
  ssh-host-keys:
