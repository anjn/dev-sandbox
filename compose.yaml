services:
  dev:
    container_name: ${CONTAINER_NAME}
    restart: always
    build:
      context: .
      dockerfile: Containerfile
    command: sudo --preserve-env=SANDBOX_SSH_PORT /usr/local/sbin/dev-sandbox-sshd
    working_dir: /workspace
    userns_mode: keep-id
    ipc: host
    security_opt:
      - seccomp=unconfined
    group_add:
      - keep-groups
    volumes:
      - ${WORKSPACE_DIR}:/workspace
      - ${HOME}/.codex:/home/ubuntu/.codex
      - ${SANDBOX_SSH_AUTHORIZED_KEYS_FILE}:/etc/dev-sandbox/authorized_keys:ro
      - ssh-host-keys:/var/lib/dev-sandbox/ssh
    environment:
      - TZ=Asia/Tokyo
      - LANG=ja_JP.UTF-8
      - LC_CTYPE=ja_JP.UTF-8
      - SANDBOX_SSH_PORT=${SANDBOX_SSH_PORT}
    network_mode: host
    stdin_open: true
    tty: true

volumes:
  ssh-host-keys:
